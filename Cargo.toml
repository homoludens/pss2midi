[package]
name = "pss2midi"
version = "0.1.0"
edition = "2021"
description = "Low-latency Yamaha PSS-F30 audio to MIDI converter"
license = "GPL-3.0-only"

[dependencies]
async-channel = "2"
alsa = "0.11"
anyhow = "1"
aubio = { version = "0.2.1", default-features = false, features = ["pkg-config"] }
midir = "0.11"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "90731bdec056817dd6dc53c6af56f016b9ec0655" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "90731bdec056817dd6dc53c6af56f016b9ec0655", default-features = false, features = ["font-kit", "wayland", "x11"] }
