[package]
name = "pss2midi"
version = "0.1.0"
edition = "2021"
description = "Low-latency Yamaha PSS-F30 audio to MIDI converter"
license = "GPL-3.0-only"

[dependencies]
alsa = "0.11"
anyhow = "1"
aubio = { version = "0.2.1", default-features = false, features = ["pkg-config"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
midir = "0.11"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
